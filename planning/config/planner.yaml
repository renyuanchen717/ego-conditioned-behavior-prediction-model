flow_c0:
  _target_: planner.FlowC0Planner
  _convert_: all
  variant: flow_c0_pdm
  candidates: 16
  config_path: ${oc.env:FLOW_INFERENCE_CONFIG}
  ckpt_path: ${oc.env:FLOW_CHECKPOINT}
  device: cuda
  use_cfg: true
  cfg_weight: 1.8
  past_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    num_poses: 20
    time_horizon: 2
  future_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    num_poses: 80
    time_horizon: 8

  enable_ema: false
