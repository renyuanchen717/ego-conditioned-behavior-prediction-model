[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dm2i-behavior-prediction"
version = "0.3.0"
description = "Frozen NDPNet with D_m2i conditional proposals and Flow Planner integration"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]
[tool.setuptools.packages.find]
where = ["src"]
